version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sleepsense_postgres
    environment:
      POSTGRES_USER: sleepsense
      POSTGRES_PASSWORD: sleepsense123
      POSTGRES_DB: sleepsense_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sleepsense"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sleepsense_network

  redis:
    image: redis:7-alpine
    container_name: sleepsense_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sleepsense_network

  backend:
    build:
      context: ./sleepsense-backend
      dockerfile: Dockerfile
    container_name: sleepsense_backend
    environment:
      - DATABASE_URL=postgresql://sleepsense:sleepsense123@postgres:5432/sleepsense_db
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./sleepsense-backend:/app
      - uploads_data:/app/uploads
    networks:
      - sleepsense_network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./sleepsense-frontend
      dockerfile: Dockerfile
    container_name: sleepsense_frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sleepsense_network

  nginx:
    image: nginx:alpine
    container_name: sleepsense_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - sleepsense_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  sleepsense_network:
    driver: bridge
