services:
  - type: web
    name: sleepsense-backend
    runtime: python
    region: oregon
    rootDir: sleepsense-backend
    buildCommand: pip install -r requirements-dev.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
